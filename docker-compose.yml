version: '3.8'

services:
  postgresql:
    image: postgres:16-alpine
    container_name: sts-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cts_user
      POSTGRES_PASSWORD: ctsDB
      POSTGRES_DB: cargo_tracking_sys_db

    volumes:
      - ./data/postgresql:/var/lib/postgresql/data

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cts_user -d cargo_tracking_sys_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: sts-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CLUSTER_ID: '4L6g3nFfF909pQ_G5W9N5A'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sts-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_CLUSTERS_0_READONLY: "false"

    depends_on:
      kafka:
        condition: service_healthy

  event-generator-service:
    container_name: event-generator-service
    build:
      context: .
      dockerfile: data-generator-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy


  event-handler-service:
      container_name: event-handler-service
      build:
        context: .
        dockerfile: event-handler-service/Dockerfile
      ports:
        - "8082:8080"
      environment:
        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/cargo_tracking_sys_db
        SPRING_DATASOURCE_USERNAME: cts_user
        SPRING_DATASOURCE_PASSWORD: ctsDB
      depends_on:
        kafka:
          condition: service_healthy
        postgresql:
          condition: service_healthy